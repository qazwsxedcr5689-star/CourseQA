<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>CourseQA - 检索统计与历史看板</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>CourseQA 检索统计与历史管理看板</h2>
    <div>
      <button onclick="window.location.href='/api/history/export'">导出 CSV</button>
      <button onclick="clearHistory()">清空历史</button>
      <a href="/" style="margin-left:12px;">返回检索页</a>
    </div>
  </div>
  <div class="grid" id="statsGrid"></div>
  <table>
    <thead>
      <tr><th>ID</th><th>时间</th><th>查询词</th><th>引擎</th><th>最高分</th><th>耗时(ms)</th><th>操作</th></tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
  <script>
    async function loadDashboard() {
      const sRes = await fetch('/api/stats');
      const stats = await sRes.json();
      document.getElementById('statsGrid').innerHTML = `
        <div class="card"><h4>总查询次数</h4><h2>${stats.total_queries}</h2></div>
        <div class="card"><h4>平均响应耗时</h4><h2>${stats.avg_elapsed_ms} ms</h2></div>
        <div class="card"><h4>平均Top1得分</h4><h2>${stats.avg_top_score}</h2></div>
        <div class="card"><h4>零命中率</h4><h2>${(stats.zero_hit_rate * 100).toFixed(1)}%</h2></div>
      `;
      const hRes = await fetch('/api/history');
      const hist = await hRes.json();
      document.getElementById('historyBody').innerHTML = hist.items.map(r => `
        <tr>
          <td>${r.id}</td><td>${r.timestamp}</td><td>${r.query}</td>
          <td>${r.engine}</td><td>${r.top_score}</td><td>${r.elapsed_ms}</td>
          <td><button onclick="delRecord('${r.id}')">删除</button></td>
        </tr>
      `).join('');
    }
    async function delRecord(id) {
      await fetch('/api/history/' + id, { method: 'DELETE' });
      loadDashboard();
    }
    async function clearHistory() {
      await fetch('/api/history', { method: 'DELETE' });
      loadDashboard();
    }
    loadDashboard();
  </script>
</body>
</html>
